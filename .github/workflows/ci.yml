name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project dependencies
        run: python -m pip install -e '.[local,dev]'
      - name: Run tests
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: python -m pytest
      - name: Run lint
        run: python -m ruff check src app streamlit_app.py scripts tests
      - name: Check formatting
        run: python -m ruff format --check src app streamlit_app.py scripts tests
      - name: Validate submission assets
        run: python scripts/check_submission.py
      - name: Run type checks
        run: python -m mypy src app
      - name: Build package
        run: python -m build
